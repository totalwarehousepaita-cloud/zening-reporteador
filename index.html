const SUPABASE_URL='https://aadlakgizkotqtnmprgs.supabase.co';
const SUPABASE_KEY='sb_publishable_wEgKTdTYdJdJTpHVySh9uQ_r9u2qfGu';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const COMPANY_SLUG='zening', PROJECT_SLUG='la-dominga-sullana', BUCKET='report-photos';
let VIEW='dashboard', MODAL=null, COMPANY=null, PROJECT=null, SCOPE=[], reports=[];
const clientParam=new URLSearchParams(location.search).get('client');
let CLIENT=!!clientParam;
const esc=s=>(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));
const TOTAL=()=>PROJECT?.estimated_days||10;
const maxDay=()=>reports.length?Math.max(...reports.map(r=>r.day)):0;
const pct=()=>Math.min(100,Math.round(maxDay()/TOTAL()*100));
// Datos visuales iniciales: permiten abrir el panel de inmediato mientras Supabase carga por detrás.
const DEFAULT_SCOPE=['Trabajos preliminares','Charla de seguridad','Inspección de herramientas eléctricas y manuales','Sistema Drywall','Instalación de mamparas y puertas','Instalaciones eléctricas','Sistema de Seguridad y comunicaciones','Instalación de horno eléctrico (ductería y punto de agua)','Trabajos de fachada (letrero y rompetráfico)','Pintura general (paredes y cielo raso)'];
function bootInstant(){
 COMPANY={slug:COMPANY_SLUG,name:'ZENING SOLUTIONS'};
 PROJECT={slug:PROJECT_SLUG,name:'Tienda La Dominga - Sullana',client_name:'PASTINOR S.A.C LA DOMINGA',location:'Sullana',estimated_days:10};
 SCOPE=DEFAULT_SCOPE.map((name,i)=>({id:'pending-'+(i+1),activity_number:i+1,name}));
 reports=[];
 render();
}
function withTimeout(p,ms=8000){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('La conexión está tardando más de lo esperado.')),ms))])}
async function init(){
 bootInstant();
 try{
  const {data:c,error:ce}=await withTimeout(db.from('companies').select('*').eq('slug',COMPANY_SLUG).single()); if(ce)throw ce; COMPANY=c;
  if(CLIENT && clientParam!==COMPANY.client_token){document.getElementById('app').innerHTML='<main><div class="empty">Enlace de cliente no válido.</div></main>';return}
  const [{data:p,error:pe},{data:sc,error:se}]=await Promise.all([
   withTimeout(db.from('projects').select('*').eq('company_id',COMPANY.id).eq('slug',PROJECT_SLUG).single()),
   withTimeout(db.from('projects').select('id').eq('company_id',COMPANY.id).eq('slug',PROJECT_SLUG).single().then(async r=>{if(r.error)return r;return await db.from('scope_activities').select('*').eq('project_id',r.data.id).order('activity_number')}))
  ]);
  if(pe)throw pe; if(se)throw se; PROJECT=p; SCOPE=sc||[];
  await withTimeout(loadReports()); render();
 }catch(e){console.error(e);
  // El panel permanece utilizable visualmente; solo avisamos si el backend no respondió.
  const m=document.getElementById('main'); if(m){const n=document.createElement('div');n.className='empty';n.style.padding='12px';n.textContent='No se pudo actualizar la información. Revisa la conexión e intenta recargar.';m.prepend(n)}
 }
}
async function loadReports(){
 const {data:rs,error}=await db.from('reports').select('*').eq('project_id',PROJECT.id).order('day'); if(error)throw error;
 if(!rs?.length){reports=[];return}
 const ids=rs.map(r=>r.id); const {data:acts,error:ae}=await db.from('report_activities').select('*').in('report_id',ids).order('created_at'); if(ae)throw ae;
 const sm=Object.fromEntries(SCOPE.map(x=>[x.id,x])); reports=rs.map(r=>({...r,activities:(acts||[]).filter(a=>a.report_id===r.id).map(a=>({...a,scope:sm[a.scope_activity_id]?.name||'Actividad',photos:Array.isArray(a.photos)?a.photos:[]}))}));
}
function render(){let a=document.getElementById('app');a.innerHTML=`<div class="topbar"><div class="brand"><img src="${LOGO}"><div class="brand-text"><strong>ZENING SOLUTIONS</strong><span>Control de ejecución</span></div></div><div class="role">${CLIENT?'CLIENTE':'ADMIN'}</div></div><main id="main"></main>`;let m=document.getElementById('main');VIEW==='dashboard'?dashboard(m):project(m)}
function dashboard(m){m.innerHTML=`<div class="hero"><h1>Panel de proyectos</h1><p>Seguimiento diario de ejecución, actividades y registro fotográfico.</p></div><div class="eyebrow">Proyecto activo</div>`;let d=maxDay(),p=pct();let c=document.createElement('div');c.className='card';c.innerHTML=`<div class="top"><div><h3>${esc(PROJECT.name)}</h3><p>${esc(PROJECT.client_name)} · ${esc(PROJECT.location||'')}</p></div><span class="pill">${d?'Día '+d+' de '+TOTAL():'Sin reportes'}</span></div><div class="track"><div class="fill" style="width:${p}%"></div></div><div class="meta"><span>${reports.length} día(s) reportado(s)</span><span>${p}% · ${TOTAL()} días estimados</span></div>`;c.onclick=()=>{VIEW='project';render()};m.appendChild(c)}
function project(m){let d=maxDay(),p=pct();m.innerHTML=`${CLIENT?'':'<div class="back" id="back">← Volver a proyectos</div>'}<div class="actions"><button class="link" id="pdf">⬇ PDF acumulado</button>${CLIENT?'':`<button class="link" id="client">👁 Vista cliente</button><button class="link" id="share">🔗 Enviar link al cliente</button>`}</div><div class="detail"><h2>${esc(PROJECT.name)}</h2><p class="sub">${esc(PROJECT.client_name)} · COT-2026-016</p><div class="dayline"><span class="big">${p}%</span><span class="of">avance · Día ${d} de ${TOTAL()}</span></div><div class="track"><div class="fill" style="width:${p}%"></div></div></div><div class="scope"><h3>Alcance del servicio</h3><ul>${SCOPE.map(x=>`<li>${esc(x.name)}</li>`).join('')}</ul></div><div class="eyebrow">Reportes diarios</div><div id="list"></div>`;document.getElementById('back')?.addEventListener('click',()=>{VIEW='dashboard';render()});document.getElementById('pdf').onclick=pdfAll;document.getElementById('client')?.addEventListener('click',()=>window.open(clientUrl(),'_blank'));document.getElementById('share')?.addEventListener('click',shareClient);let list=document.getElementById('list');if(!reports.length)list.innerHTML='<div class="empty">📋<br><br>Todavía no hay reportes de obra.</div>';[...reports].sort((a,b)=>a.day-b.day).forEach(r=>list.appendChild(reportCard(r)));if(!CLIENT){let f=document.createElement('button');f.className='fab';f.textContent='＋ Reportar avance';f.onclick=()=>openModal();m.appendChild(f)}}
function clientUrl(){let u=new URL(location.href);u.search='';u.searchParams.set('client',COMPANY.client_token);return u.toString()}
async function shareClient(){let url=clientUrl(),data={title:'Avance de obra · Zening Solutions',text:'Consulta el avance del proyecto Tienda La Dominga - Sullana:',url};try{if(navigator.share)await navigator.share(data);else{await navigator.clipboard.writeText(url);alert('Enlace del cliente copiado.')}}catch(e){if(e.name!=='AbortError')prompt('Copia este enlace para el cliente:',url)}}
function reportCard(r){let c=document.createElement('div');c.className='tl';let n=r.activities.length,ph=r.activities.reduce((a,x)=>a+x.photos.length,0);c.innerHTML=`<div class="tlhead"><div class="dwrap"><div class="dnum">D${r.day}</div><div><div class="date">Día ${r.day} de ${TOTAL()}</div><div class="summary">${r.report_date} · ${n} actividad(es) · ${ph} foto(s)</div></div></div><div class="badge">${Math.round(r.day/TOTAL()*100)}%</div></div><div class="tlbody">${r.activities.map((a,i)=>`<div class="act"><div class="acttitle">Actividad ${i+1} · ${esc(a.scope)}</div><p>${esc(a.description)}</p><div class="photos">${a.photos.map(x=>`<img src="${x}">`).join('')}</div></div>`).join('')}<div class="minirow"><button class="mini onepdf">⬇ PDF del día</button>${CLIENT?'':`<button class="mini edit">Editar día</button><button class="mini danger del">Eliminar día</button>`}</div></div>`;c.querySelectorAll('img').forEach(i=>i.onclick=()=>light(i.src));c.querySelector('.onepdf').onclick=()=>pdfDay(r);c.querySelector('.edit')?.addEventListener('click',()=>openModal(r.day));c.querySelector('.del')?.addEventListener('click',()=>deleteDay(r));return c}
function blank(){return{id:crypto.randomUUID(),scope_activity_id:SCOPE[0]?.id,scope:SCOPE[0]?.name||'',description:'',photos:[],newFiles:[]}}
function openModal(day=null){let existing=reports.find(r=>r.day===day);MODAL={originalDay:day,day:day||Math.min(TOTAL(),maxDay()+1||1),date:existing?.report_date||new Date().toISOString().slice(0,10),activities:existing?structuredClone(existing.activities).map(a=>({...a,newFiles:[]})):[blank()]};modalRender()}
function modalRender(){document.querySelector('.overlay')?.remove();let o=document.createElement('div');o.className='overlay';o.innerHTML=`<div class="modal"><div class="mh"><h2>Reporte de avance</h2><button class="x">✕</button></div><div class="field"><label>Día de obra</label><select id="day">${Array.from({length:TOTAL()},(_,i)=>i+1).map(x=>`<option ${x===MODAL.day?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Fecha</label><input type="date" id="date" value="${MODAL.date}"></div><div class="field"><label>Actividades realizadas</label><div id="eds"></div><button class="addAct" id="add">＋ Agregar otra actividad</button></div></div><div class="footer"><button class="save" id="save">Guardar reporte del día</button></div>`;document.body.appendChild(o);o.querySelector('.x').onclick=()=>o.remove();o.onclick=e=>{if(e.target===o)o.remove()};document.getElementById('day').onchange=e=>MODAL.day=+e.target.value;document.getElementById('date').onchange=e=>MODAL.date=e.target.value;document.getElementById('add').onclick=()=>{MODAL.activities.push(blank());editors()};document.getElementById('save').onclick=save;editors()}
function editors(){let c=document.getElementById('eds');c.innerHTML=MODAL.activities.map((a,i)=>`<div class="editor" data-id="${a.id}"><div class="eh"><b>ACTIVIDAD ${i+1}</b>${MODAL.activities.length>1?`<button class="mini danger rm" data-id="${a.id}">Quitar</button>`:''}</div><div class="field"><label>Actividad del alcance</label><select class="scopeSel" data-id="${a.id}">${SCOPE.map(s=>`<option value="${s.id}" ${s.id===a.scope_activity_id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Descripción / avance realizado</label><textarea class="txt" data-id="${a.id}" placeholder="Describe el trabajo realizado, observaciones o pendientes...">${esc(a.description)}</textarea></div><div class="photos">${a.photos.map((p,j)=>`<div class="thumb"><img src="${p}"><button class="rmp" data-id="${a.id}" data-i="${j}">×</button></div>`).join('')}</div><div class="photoBtns"><button class="cam" data-id="${a.id}">📷 Tomar foto</button><button class="up" data-id="${a.id}">⬆ Subir foto / archivo</button></div><input hidden class="camin" data-id="${a.id}" type="file" accept="image/*" capture="environment"><input hidden class="upin" data-id="${a.id}" type="file" accept="image/*" multiple></div>`).join('');c.querySelectorAll('.scopeSel').forEach(x=>x.onchange=e=>{let a=MODAL.activities.find(a=>a.id===e.target.dataset.id);a.scope_activity_id=e.target.value;a.scope=SCOPE.find(s=>s.id===e.target.value)?.name||''});c.querySelectorAll('.txt').forEach(x=>x.oninput=e=>MODAL.activities.find(a=>a.id===e.target.dataset.id).description=e.target.value);c.querySelectorAll('.rm').forEach(x=>x.onclick=()=>{MODAL.activities=MODAL.activities.filter(a=>a.id!==x.dataset.id);editors()});c.querySelectorAll('.rmp').forEach(x=>x.onclick=()=>{let a=MODAL.activities.find(a=>a.id===x.dataset.id);a.photos.splice(+x.dataset.i,1);editors()});c.querySelectorAll('.cam').forEach(x=>x.onclick=()=>c.querySelector(`.camin[data-id="${x.dataset.id}"]`).click());c.querySelectorAll('.up').forEach(x=>x.onclick=()=>c.querySelector(`.upin[data-id="${x.dataset.id}"]`).click());c.querySelectorAll('.camin,.upin').forEach(inp=>inp.onchange=async e=>{let a=MODAL.activities.find(a=>a.id===e.target.dataset.id);for(let f of e.target.files){let b=await compressFile(f);a.newFiles.push(b);a.photos.push(URL.createObjectURL(b))}editors()})}
async function compressFile(f){return new Promise(res=>{let r=new FileReader();r.onload=e=>{let im=new Image();im.onload=()=>{let sc=Math.min(1,1600/im.width),cv=document.createElement('canvas');cv.width=Math.round(im.width*sc);cv.height=Math.round(im.height*sc);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cv.toBlob(b=>res(new File([b],(f.name||'foto').replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'})),'image/jpeg',.78)};im.src=e.target.result};r.readAsDataURL(f)})}
async function uploadFiles(activity,day){let existing=activity.photos.filter(x=>x.startsWith('http'));let urls=[...existing];for(let f of activity.newFiles||[]){let path=`${COMPANY.slug}/${PROJECT.slug}/dia-${day}/${crypto.randomUUID()}.jpg`;let {error}=await db.storage.from(BUCKET).upload(path,f,{contentType:'image/jpeg',upsert:false});if(error)throw error;urls.push(db.storage.from(BUCKET).getPublicUrl(path).data.publicUrl)}return urls}
async function save(){let acts=MODAL.activities.filter(a=>a.description.trim()||a.photos.length||a.newFiles?.length);if(!acts.length)return alert('Agrega al menos una actividad.');let btn=document.getElementById('save');btn.disabled=true;btn.textContent='Guardando…';try{
 let conflict=reports.find(r=>r.day===MODAL.day && r.day!==MODAL.originalDay);if(conflict)throw new Error('Ya existe un reporte para el Día '+MODAL.day+'.');
 let report=reports.find(r=>r.day===MODAL.originalDay);if(report){let {error}=await db.from('reports').update({day:MODAL.day,report_date:MODAL.date,updated_at:new Date().toISOString()}).eq('id',report.id);if(error)throw error;await db.from('report_activities').delete().eq('report_id',report.id)}else{let {data,error}=await db.from('reports').insert({project_id:PROJECT.id,day:MODAL.day,report_date:MODAL.date}).select().single();if(error)throw error;report=data}
 for(let a of acts){let photos=await uploadFiles(a,MODAL.day);let {error}=await db.from('report_activities').insert({report_id:report.id,scope_activity_id:a.scope_activity_id,description:a.description,photos});if(error)throw error}
 document.querySelector('.overlay')?.remove();await loadReports();render();
}catch(e){console.error(e);alert('No se pudo guardar: '+e.message);btn.disabled=false;btn.textContent='Guardar reporte del día'}}
async function deleteDay(r){if(!confirm('¿Eliminar el Día '+r.day+' completo?'))return;try{for(let a of r.activities)for(let url of a.photos){let marker='/storage/v1/object/public/'+BUCKET+'/';if(url.includes(marker)){let path=decodeURIComponent(url.split(marker)[1]);await db.storage.from(BUCKET).remove([path])}}let {error}=await db.from('reports').delete().eq('id',r.id);if(error)throw error;await loadReports();render()}catch(e){alert('No se pudo eliminar: '+e.message)}}
function light(src){let l=document.createElement('div');l.className='light';l.innerHTML=`<img src="${src}">`;l.onclick=()=>l.remove();document.body.appendChild(l)}
function pdfBody(rs,title){return `<div style="font-family:Arial;padding:28px;color:#111"><div style="background:#050607;padding:15px;border-bottom:4px solid #1266f1"><img src="${LOGO}" style="width:180px;background:#fff"></div><h1 style="font-size:22px">${title}</h1><p><b>Proyecto:</b> ${esc(PROJECT.name)}<br><b>Cliente:</b> ${esc(PROJECT.client_name)}<br><b>Código:</b> COT-2026-016</p>${rs.map(r=>`<hr><h2>Día ${r.day} · ${r.report_date}</h2>${r.activities.map((a,i)=>`<h3 style="color:#0d4fc1">Actividad ${i+1}: ${esc(a.scope)}</h3><p>${esc(a.description)}</p><div>${a.photos.map(p=>`<img src="${p}" crossorigin="anonymous" style="width:46%;max-height:280px;object-fit:cover;margin:5px">`).join('')}</div>`).join('')}`).join('')}</div>`}
async function makePdf(rs,name,title){let x=document.createElement('div');x.innerHTML=pdfBody(rs,title);document.body.appendChild(x);await Promise.all([...x.querySelectorAll('img')].map(im=>im.complete?Promise.resolve():new Promise(r=>{im.onload=im.onerror=r})));html2pdf().set({margin:7,filename:name,image:{type:'jpeg',quality:.9},html2canvas:{scale:1.5,useCORS:true},jsPDF:{unit:'mm',format:'a4',orientation:'portrait'}}).from(x).save().then(()=>x.remove())}
function pdfDay(r){makePdf([r],`Zening_Dia_${r.day}.pdf`,`Reporte diario · Día ${r.day}`)}function pdfAll(){if(!reports.length)return alert('Aún no hay reportes.');makePdf([...reports].sort((a,b)=>a.day-b.day),'Zening_Reporte_Acumulado.pdf','Reporte acumulado de obra')}
init();
</script></body></html>
